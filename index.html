<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ed1c24">
  <meta name="description" content="Assist Memo — diagnóstico técnico passo a passo para equipamentos de refrigeração.">
  <title>Memo | Diagnóstico técnico</title>\n  <meta name="build" content="sem-assist-v1">
  <style>

:root {
  --memo-red: #ed1c24;
  --memo-red-dark: #af0e14;
  --memo-orange: #fbab24;
  --memo-cream: #efece0;
  --ink: #1b1b1b;
  --muted: #818285;
  --line: #d1cfc5;
  --soft: #efece0;
  --white: #ffffff;
  --green: #21734b;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--soft);
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--soft);
  font-family: Roboto, Arial, Helvetica, sans-serif;
}

button,
a {
  font: inherit;
}

button {
  color: inherit;
}

.splash {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  overflow: hidden;
  background:
    radial-gradient(circle at 78% 18%, rgba(251, 171, 36, 0.24), transparent 28%),
    linear-gradient(135deg, var(--memo-red), var(--memo-red-dark));
}

.splash::before,
.splash::after {
  content: "";
  position: fixed;
  width: 560px;
  height: 560px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transform: rotate(45deg);
}

.splash::before {
  top: -370px;
  left: -180px;
}

.splash::after {
  right: -300px;
  bottom: -360px;
}

.splash-entry {
  z-index: 1;
  width: min(540px, 100%);
  padding: 48px 42px 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 0;
  border-radius: 8px;
  color: var(--ink);
  background: var(--memo-cream);
  box-shadow: 0 28px 90px rgba(70, 0, 3, 0.28);
  cursor: pointer;
}

.splash-entry img {
  width: min(320px, 82%);
  height: auto;
}

.splash-divider {
  width: 54px;
  height: 3px;
  margin: 30px 0 22px;
  background: var(--memo-red);
}

.splash-entry strong {
  color: var(--memo-red);
  font-size: clamp(34px, 7vw, 54px);
  letter-spacing: 0.24em;
}

.splash-entry small {
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.enter-label {
  margin-top: 54px;
  padding: 12px 18px;
  border: 1px solid var(--memo-red);
  border-radius: 40px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--memo-red);
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  min-height: 76px;
  padding: 0 max(22px, calc((100% - 1180px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 4px solid var(--memo-red);
  background: var(--white);
}

.memo-brand {
  padding: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  color: var(--ink);
}

.memo-brand > img {
  width: 126px;
  height: auto;
  object-fit: contain;
}

.memo-brand strong,
.memo-brand small {
  display: block;
}

.memo-brand strong {
  font-size: 14px;
  letter-spacing: 0.16em;
}

.memo-brand small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}

.header-actions button {
  min-height: 42px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.header-actions button:hover {
  background: var(--memo-cream);
}

.header-actions span {
  color: var(--memo-red);
  font-size: 17px;
}

.app-content {
  flex: 1;
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 38px 0 68px;
}

.back-button {
  margin-bottom: 28px;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.back-button span {
  color: var(--memo-red);
  font-size: 20px;
}

.screen-heading {
  max-width: 760px;
  margin-bottom: 30px;
}

.section-kicker {
  margin: 0 0 8px;
  color: var(--memo-red);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.15em;
}

.screen-heading h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1.05;
  letter-spacing: -0.035em;
}

.screen-heading > p:last-child {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 16px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.product-card {
  position: relative;
  min-height: 390px;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  text-align: left;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}

.product-card:hover {
  transform: translateY(-4px);
  border-color: #c9a4a6;
  box-shadow: 0 18px 45px rgba(22, 24, 28, 0.1);
}

.product-media {
  position: relative;
  height: 235px;
  overflow: hidden;
  display: block;
  background: #e8e8e9;
}

.product-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 260ms ease;
}

.product-card:hover .product-media img {
  transform: scale(1.035);
}

.product-media > span {
  position: absolute;
  top: 16px;
  left: 16px;
  padding: 7px 9px;
  border-radius: 2px;
  background: var(--memo-red);
  color: white;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.product-copy {
  padding: 22px 50px 24px 22px;
}

.product-copy strong,
.product-copy small {
  display: block;
}

.product-copy strong {
  font-size: 20px;
}

.product-copy small {
  margin-top: 9px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.product-arrow {
  position: absolute;
  right: 20px;
  bottom: 24px;
  color: var(--memo-red);
  font-size: 23px;
}

.selected-product {
  margin-bottom: 14px;
  padding: 15px 18px;
  display: flex;
  justify-content: space-between;
  border: 1px solid #ead0d2;
  border-radius: 4px;
  background: #fff;
  font-size: 12px;
}

.selected-product span {
  color: var(--muted);
}

.selected-product strong {
  color: var(--memo-red);
}

.symptom-menu {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
}

.symptom-menu button {
  width: 100%;
  min-height: 138px;
  padding: 18px 24px;
  display: grid;
  grid-template-columns: 50px 105px 1fr 40px;
  align-items: center;
  gap: 18px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: white;
  text-align: left;
  cursor: pointer;
  transition: background 150ms ease;
}

.symptom-menu button:last-child {
  border-bottom: 0;
}

.symptom-menu button:hover {
  background: #fff9f9;
}

.symptom-index {
  color: #a2a5aa;
  font-size: 11px;
  font-weight: 800;
}

.symptom-menu img {
  width: 96px;
  height: 88px;
  object-fit: contain;
  filter: grayscale(1);
}

.symptom-text strong,
.symptom-text small {
  display: block;
}

.symptom-text strong {
  font-size: 23px;
}

.symptom-text small {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;
}

.symptom-arrow {
  color: var(--memo-red);
  font-size: 25px;
}

.diagnostic-layout {
  max-width: 860px;
  margin: 0 auto;
}

.diagnostic-progress {
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.progress-dots {
  display: flex;
  gap: 5px;
}

.progress-dots i {
  width: 22px;
  height: 4px;
  border-radius: 4px;
  background: #d8dade;
}

.progress-dots i:first-child,
.progress-dots i:nth-child(2) {
  background: var(--memo-red);
}

.diagnostic-card {
  padding: clamp(28px, 6vw, 58px);
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  box-shadow: 0 14px 34px rgba(27, 27, 27, 0.08);
}

.diagnostic-icon {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 4px;
  color: white;
  background: var(--memo-red);
  font-size: 24px;
  font-weight: 800;
}

.diagnostic-code {
  margin: 26px 0 10px;
  color: var(--memo-red);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
}

.diagnostic-card h2 {
  max-width: 720px;
  margin: 0;
  font-size: clamp(27px, 4.5vw, 42px);
  line-height: 1.14;
  letter-spacing: -0.03em;
}

.supporting-copy {
  margin-top: 20px;
  padding: 16px 18px;
  border-radius: 4px;
  background: var(--soft);
}

.supporting-copy p {
  margin: 5px 0;
  color: #5d6168;
  font-size: 14px;
  line-height: 1.55;
}

.critical-warning {
  margin-top: 18px;
  padding: 15px 17px;
  border: 1px solid #e9b8bb;
  border-radius: 4px;
  color: #70474a;
  background: #fff5f5;
  font-size: 13px;
  line-height: 1.5;
}

.critical-warning strong {
  display: block;
  color: var(--memo-red);
}

.original-checklist {
  margin-top: 22px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.original-checklist label {
  padding: 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: #565a61;
  font-size: 13px;
  line-height: 1.4;
  cursor: pointer;
}

.original-checklist input {
  accent-color: var(--memo-red);
}

.diagnostic-actions {
  margin-top: 32px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.diagnostic-actions.single {
  grid-template-columns: 1fr;
}

.diagnostic-actions button,
.terminal-actions button,
.terminal-actions a {
  min-height: 64px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
}

.diagnostic-actions button span {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.diagnostic-actions .yes {
  border: 1px solid #b8d7c7;
  color: var(--green);
  background: #f1faf5;
}

.diagnostic-actions .yes span {
  color: white;
  background: var(--green);
}

.diagnostic-actions .no {
  border: 1px solid #ebc1c4;
  color: var(--memo-red);
  background: #fff6f6;
}

.diagnostic-actions .no span {
  color: white;
  background: var(--memo-red);
}

.secondary-diagnostic {
  border: 1px solid var(--ink);
  color: white;
  background: var(--ink);
}

.secondary-diagnostic span {
  color: var(--ink);
  background: white;
}

.terminal .diagnostic-icon {
  color: var(--green);
  background: #eaf6ef;
}

.terminal-actions {
  margin-top: 30px;
  display: flex;
  gap: 10px;
}

.terminal-actions button {
  border: 1px solid var(--memo-red);
  color: white;
  background: var(--memo-red);
}

.terminal-actions a {
  border: 1px solid var(--line);
  color: var(--ink);
  background: white;
}

.pressure-screen,
.video-card,
.support-card,
.empty-original {
  max-width: 880px;
  margin: 0 auto;
  padding: clamp(24px, 5vw, 46px);
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
}

.pressure-screen img {
  width: 100%;
  height: auto;
}

.video-card > div p,
.support-card > p {
  margin: 0 0 8px;
  color: var(--memo-red);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
}

.video-card h2,
.support-card h2,
.empty-original h2 {
  margin: 0 0 24px;
  font-size: clamp(25px, 4vw, 38px);
}

.video-card iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 4px;
}

.support-card {
  text-align: center;
  background: var(--ink);
  color: white;
}

.support-card > img {
  width: min(220px, 70%);
  height: auto;
  margin-bottom: 30px;
}

.support-card > p {
  margin-bottom: 12px;
}

.support-card h2 {
  max-width: 650px;
  margin-right: auto;
  margin-left: auto;
}

.support-card > div {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.support-card a,
.empty-original button {
  min-height: 52px;
  padding: 0 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--memo-red);
  border-radius: 4px;
  color: white;
  background: var(--memo-red);
  font-size: 13px;
  font-weight: 800;
  text-decoration: none;
}

.support-card a + a {
  color: white;
  border-color: #818285;
  background: transparent;
}

.empty-original {
  text-align: center;
}

.empty-original > span {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: white;
  background: var(--memo-red);
  font-weight: 800;
}

.empty-original p {
  max-width: 560px;
  margin: 0 auto 24px;
  color: var(--muted);
  line-height: 1.6;
}

.empty-original button {
  cursor: pointer;
}

.app-footer {
  min-height: 58px;
  padding: 0 max(22px, calc((100% - 1180px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 4px solid var(--memo-red);
  color: #cfcfd0;
  background: var(--ink);
  font-size: 11px;
}

@media (max-width: 760px) {
  .splash-entry {
    padding: 42px 24px 30px;
  }

  .app-header {
    min-height: 68px;
    padding: 0 14px;
  }

  .memo-brand > img {
    width: 102px;
  }

  .memo-brand small {
    display: none;
  }

  .header-actions button {
    min-width: 40px;
    padding: 0 8px;
    flex-direction: column;
    justify-content: center;
    gap: 0;
    font-size: 8px;
  }

  .app-content {
    width: min(100% - 24px, 600px);
    padding-top: 24px;
  }

  .screen-heading {
    margin-bottom: 22px;
  }

  .product-grid {
    grid-template-columns: 1fr;
  }

  .product-card {
    min-height: 150px;
    display: grid;
    grid-template-columns: 128px 1fr;
  }

  .product-media {
    height: 100%;
    min-height: 150px;
  }

  .product-media > span {
    top: 10px;
    left: 8px;
    font-size: 7px;
  }

  .product-copy {
    padding: 25px 35px 22px 18px;
  }

  .product-copy strong {
    font-size: 17px;
  }

  .product-copy small {
    font-size: 12px;
  }

  .product-arrow {
    right: 13px;
    bottom: 20px;
  }

  .selected-product {
    align-items: flex-start;
    flex-direction: column;
    gap: 4px;
  }

  .symptom-menu button {
    min-height: 112px;
    padding: 14px;
    grid-template-columns: 26px 66px 1fr 22px;
    gap: 10px;
  }

  .symptom-menu img {
    width: 62px;
    height: 66px;
  }

  .symptom-text strong {
    font-size: 18px;
  }

  .symptom-text small {
    font-size: 11px;
    line-height: 1.4;
  }

  .diagnostic-card {
    padding: 26px 20px;
  }

  .diagnostic-card h2 {
    font-size: 28px;
  }

  .diagnostic-actions,
  .original-checklist {
    grid-template-columns: 1fr;
  }

  .terminal-actions,
  .support-card > div {
    flex-direction: column;
  }

  .app-footer {
    padding: 16px 14px;
    align-items: flex-start;
    gap: 14px;
    flex-direction: column;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

  .original-checklist input{width:20px;height:20px;accent-color:var(--memo-red)}
  .critical-warning{margin:22px 0;padding:16px;border-left:4px solid #d61920;background:#fff2f2;line-height:1.55}
  .critical-warning strong{display:block;margin-bottom:4px}
  </style>

      ["preresfriadores","Pré-resfriadores","Acesso à área original de pré-resfriadores.","preresf.jpg","PRÉ-RESFRIADORES"]
    ];
    return '<section class="product-grid" aria-label="Linhas de produto">'+p.map(x=>`<button class="product-card" data-nav="${esc(s.navigation[x[0]])}"><span class="product-media"><img src="${asset(x[3])}" alt=""><span>${x[4]}</span></span><span class="product-copy"><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="product-arrow">→</span></button>`).join("")+"</section>";
  }
  function symptomMenu(s){
    const p=s.name==="T0C"?"Linha HUG":"Expansão direta";
    const items=[["NÃO_GELA","Não refrigera","Comando, compressor e circuito frigorífico.","pngwing.com(1).png"],["ILUMINAÇÃO","Iluminação","Fonte, chicote e barra de LED.","pngwing.com.png"],["VAZAMENTO","Vazamento","Conexões, torneira e vedações.","vazamento.png"]];
    return `<div class="selected-product"><span>Equipamento selecionado</span><strong>${p}</strong></div><section class="symptom-menu">${items.map((x,i)=>`<button data-nav="${esc(s.navigation[x[0]])}"><span class="symptom-index">0${i+1}</span><img src="${asset(x[3])}" alt=""><span class="symptom-text"><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="symptom-arrow">→</span></button>`).join("")}</section>`;
  }
  function diagnostic(s){
    const labels=s.elements.filter(x=>x.type==="Label"&&x.text).map(x=>clean(x.text));
    const boxes=s.elements.filter(x=>x.type==="CheckBox");
    const buttons=s.elements.filter(x=>x.type==="Button"&&x.text);
    const navigation=Object.entries(s.navigation).filter(([k])=>!globals.has(k));
    const terminal=!navigation.length;
    const override=s.name==="T112122"?"Com a pressão dentro do limite e seguindo o procedimento elétrico da Memo, confirme se o pressostato está interrompendo indevidamente o compressor. O compressor volta a funcionar?":null;
    const main=override||labels.find(x=>x.endsWith("?"))||labels[0]||"Procedimento técnico";
    const support=labels.filter(x=>x!==main);
    const actions=navigation.map(([component,target])=>{
      const el=s.elements.find(x=>x.name===component), b=buttons.find(x=>x.name===component);
      let text=b?.text||el?.text;
      const c=component.toUpperCase();
      if(!text) text=c.includes("SIM")?"SIM":(c.includes("NAO")||c.includes("NÃO"))?"NÃO":(c.includes("TENS")||c.includes("CONTIN"))?"VER COMO MEDIR":component.toLowerCase().includes("press")?"CONSULTAR TABELA":"AVANÇAR";
      return {target,text:clean(text)};
    }).filter(x=>x.target&&screens[x.target]);
    const warning=s.name==="T112122"?'<div class="critical-warning"><strong>Proteção obrigatória</strong>Nunca deixe o pressostato de alta ponteado. Qualquer teste deve ser controlado, com pressão monitorada e conforme o procedimento Memo.</div>':s.name==="T1C_1_1_2"?'<div class="critical-warning"><strong>Atenção</strong>Não desative proteções LU/HU sem autorização e registro formal da condição elétrica encontrada.</div>':"";
    return `<section class="diagnostic-layout"><div class="diagnostic-progress"><span>Diagnóstico em andamento</span><span class="progress-dots"><i></i><i></i><i></i><i></i><i></i></span></div><article class="diagnostic-card ${terminal?"terminal":""}"><div class="diagnostic-icon">${terminal?"✓":s.name.startsWith("T2")?"V":"?"}</div><p class="diagnostic-code">PROCEDIMENTO ${esc(s.name)}</p><h2>${esc(main)}</h2>${support.length?'<div class="supporting-copy">'+support.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>':""}${warning}${boxes.length?'<div class="original-checklist">'+boxes.map(x=>`<label><input type="checkbox" data-check="${esc(x.name)}" ${checks[x.name]?"checked":""}><span>${esc(clean(x.text||x.name))}</span></label>`).join("")+'</div>':""}${!terminal?'<div class="diagnostic-actions '+(actions.length===1?"single":"")+'">'+actions.map(a=>{const u=a.text.toUpperCase(),y=u==="SIM",n=u==="NÃO"||u==="NAO";return `<button class="${y?"yes":n?"no":"secondary-diagnostic"}" data-nav="${esc(a.target)}"><span>${y?"✓":n?"×":"→"}</span>${esc(a.text)}</button>`}).join("")+'</div>':'<div class="terminal-actions"><button data-home>Novo diagnóstico</button><a href="tel:+551639699797">Falar com a assistência</a></div>'}</article></section>`;
  }
  function content(s){
    if(s.name==="home")return productMenu(s);
    if(s.name==="T0"||s.name==="T0C")return symptomMenu(s);
    if(s.name==="T0P")return '<section class="empty-original"><span>PR</span><h2>Pré-resfriadores</h2><p>Esta tela já existia no aplicativo original, mas ainda não possuía procedimentos cadastrados.</p><button data-home>Escolher outro equipamento</button></section>';
    if(s.name==="sac")return `<section class="support-card"><img src="${asset("logo.png")}" alt="Memo"><p>Entrar em contato com a assistência técnica Memo</p><h2>Envie uma foto da etiqueta do equipamento para agilizar o atendimento.</h2><div><a href="https://wa.me/5516988482342" target="_blank">WhatsApp</a><a href="tel:+551639699797">Ligar</a></div></section>`;
    if(s.name==="site")return `<section class="support-card site-card"><img src="${asset("logo.png")}" alt="Memo"><p>MEMO — Soluções em refrigeração</p><h2>Consulte produtos, documentos e informações institucionais.</h2><div><a href="https://www.memo.ind.br" target="_blank">Abrir site da Memo</a></div></section>`;
    const web=s.elements.find(x=>x.type==="WebViewer"&&x.url);
    if(web){let u=web.url;try{const id=new URL(u).searchParams.get("v");if(id)u="https://www.youtube.com/embed/"+id}catch{}return `<section class="video-card"><div><p>VÍDEO DE APOIO</p><h2>${esc(titles[s.name]||"Diagnóstico técnico")}</h2></div><iframe src="${esc(u)}" title="Vídeo de apoio" allowfullscreen></iframe></section>`}
    if(s.name==="TABELADEPRESSOES")return `<section class="pressure-screen"><img src="${asset("PRESSOES.PNG")}" alt="Tabela de pressões das chopeiras"></section>`;
    return diagnostic(s);
  }
  function render(){
    const s=screens[current]||screens.home;
    if(s.name==="Screen1"){
      $("#app").innerHTML=`<main class="splash"><button class="splash-entry" data-nav="${esc(s.navigation.Imagem1||"home")}" aria-label="Entrar no diagnóstico Memo"><img src="${asset("logo.png")}" alt="Memo — Melhores momentos"><span class="splash-divider"></span><small>Assistência técnica inteligente</small><span class="enter-label">TOQUE PARA ENTRAR</span></button></main>`;
    } else {
      const isHome=s.name==="home";
      $("#app").innerHTML=`<main class="app-shell"><header class="app-header"><button class="memo-brand" data-home><img src="${asset("logo.png")}" alt="Memo"></button><nav class="header-actions">${!isHome?'<button data-home><span>⌂</span>Início</button>':""}<button data-nav="sac"><span>?</span>SAC</button><button data-nav="site"><span>↗</span>Site</button></nav></header><div class="app-content">${!isHome?'<button class="back-button" data-back><span>←</span> Voltar</button>':""}${heading(s,isHome)}${content(s)}</div><footer class="app-footer"><span>Memo • Assistência Técnica</span><span>${Object.keys(screens).length} telas do aplicativo integradas</span></footer></main>`;
    }
    document.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>nav(x.dataset.nav));
    document.querySelectorAll("[data-home]").forEach(x=>x.onclick=home);
    document.querySelectorAll("[data-back]").forEach(x=>x.onclick=back);
    document.querySelectorAll("[data-check]").forEach(x=>x.onchange=()=>checks[x.dataset.check]=x.checked);
  }
  render();
  </script>
</body>
</html>
